{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="form-card"><h1>Login</h1><form method="post">{% csrf_token %}{{ form.as_p }}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="btn btn-primary w-100">Login</button></form><p class="mt-3">No account? <a href="{% url 'accounts:register' %}">Register</a></p></div>
{% endblock %}
