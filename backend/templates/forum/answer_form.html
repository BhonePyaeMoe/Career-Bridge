{% extends 'base.html' %}
{% block title %}Edit Answer{% endblock %}
{% block content %}<div class="form-card wide"><h1>Edit answer</h1><p class="text-muted">Question: {{ answer.question.title }}</p><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Save answer</button> <a class="btn btn-outline-secondary" href="{% url 'forum:detail' answer.question.pk %}">Cancel</a></form></div>{% endblock %}
